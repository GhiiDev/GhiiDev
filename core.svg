<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500">
  <style>
    .scene { perspective: 1600px; transform-style: preserve-3d; }
    
    .gyro { 
      transform-origin: 300px 300px; 
      transform-style: preserve-3d; 
      animation: matrixTumble 12s infinite linear; 
    }
    
    @keyframes matrixTumble {
      0% { transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg); }
      100% { transform: rotateX(360deg) rotateY(720deg) rotateZ(360deg); }
    }

    .ascii { 
      font-family: 'Courier New', monospace; 
      font-size: 16px; 
      font-weight: bold; 
      text-anchor: middle; 
      dominant-baseline: middle;
      white-space: pre; 
    }
    
    /* Planos com origem de transformação cravada no centro 250x250 */
    .plane-1 { fill: #ffffff; }
    .plane-2 { fill: #aaaaaa; transform-origin: 250px 250px; transform: rotateY(90deg); }
    .plane-3 { fill: #555555; transform-origin: 250px 250px; transform: rotateX(90deg); }
    .plane-4 { fill: #888888; transform-origin: 250px 250px; transform: rotateX(45deg) rotateY(45deg); }
    
    .core-node { fill: #ffffff; font-size: 26px; font-weight: 900; }
  </style>
  
  <g class="scene">
    <g class="gyro">
      
      <text x="250" y="250" class="ascii core-node"></text>
      
      <!-- Anel 1 (Eixo Z Frontal) -->
      <g class="ascii plane-1">
        <text x="250" y="169">      @@@@@@@      </text>
        <text x="250" y="187">   @@@       @@@   </text>
        <text x="250" y="205">  @@           @@  </text>
        <text x="250" y="223"> @@             @@ </text>
        <text x="250" y="241"> @@             @@ </text>
        <text x="250" y="259"> @@             @@ </text>
        <text x="250" y="277"> @@             @@ </text>
        <text x="250" y="295">  @@           @@  </text>
        <text x="250" y="313">   @@@       @@@   </text>
        <text x="250" y="331">      @@@@@@@      </text>
      </g>

      <!-- Anel 2 (Eixo Y Lateral) -->
      <g class="ascii plane-2">
        <text x="250" y="169">      =======      </text>
        <text x="250" y="187">   ===       ===   </text>
        <text x="250" y="205">  ==           ==  </text>
        <text x="250" y="223"> ==             == </text>
        <text x="250" y="241"> ==             == </text>
        <text x="250" y="259"> ==             == </text>
        <text x="250" y="277"> ==             == </text>
        <text x="250" y="295">  ==           ==  </text>
        <text x="250" y="313">   ===       ===   </text>
        <text x="250" y="331">      =======      </text>
      </g>

      <!-- Anel 3 (Eixo X Superior) -->
      <g class="ascii plane-3">
        <text x="250" y="169">      0101010      </text>
        <text x="250" y="187">   101       010   </text>
        <text x="250" y="205">  01           10  </text>
        <text x="250" y="223"> 10             01 </text>
        <text x="250" y="241"> 01             10 </text>
        <text x="250" y="259"> 10             01 </text>
        <text x="250" y="277"> 01             10 </text>
        <text x="250" y="295">  10           01  </text>
        <text x="250" y="313">   010       101   </text>
        <text x="250" y="331">      1010101      </text>
      </g>

      <!-- Anel 4 (Eixo Diagonal) -->
      <g class="ascii plane-4">
        <text x="250" y="169">      -------      </text>
        <text x="250" y="187">   ---       ---   </text>
        <text x="250" y="205">  --           --  </text>
        <text x="250" y="223"> --             -- </text>
        <text x="250" y="241"> --             -- </text>
        <text x="250" y="259"> --             -- </text>
        <text x="250" y="277"> --             -- </text>
        <text x="250" y="295">  --           --  </text>
        <text x="250" y="313">   ---       ---   </text>
        <text x="250" y="331">      -------      </text>
      </g>
    </g>
  </g>
</svg>
