<svg xmlns="http://www.w3.org/2000/svg" width="280" height="280" viewBox="0 0 280 280">
  <style>
    
    .scene { perspective: 800px; transform-style: preserve-3d; }
    
    .gyro { 
      transform-origin: 140px 140px; 
      transform-style: preserve-3d; 
      animation: matrixTumble 12s infinite linear; 
    }
    
    @keyframes matrixTumble {
      0% { transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg); }
      100% { transform: rotateX(360deg) rotateY(720deg) rotateZ(360deg); }
    }

    .ascii { 
      font-family: 'Courier New', monospace; 
      font-size: 16px; 
      font-weight: bold; 
      text-anchor: middle; 
      dominant-baseline: middle;
      white-space: pre; 
    }
    
    .plane-1 { fill: #ffffff; }
    .plane-2 { fill: #aaaaaa; transform: rotateY(90deg); }
    .plane-3 { fill: #555555; transform: rotateX(90deg); }
    .plane-4 { fill: #888888; transform: rotateX(45deg) rotateY(45deg); }
    
    .core-node { fill: #ffffff; font-size: 24px; font-weight: 900; }
  </style>
  
  <g class="scene">
    <g class="gyro">
      
      <text x="140" y="140" class="ascii core-node">G</text>
      
      <g class="ascii plane-1">
        <text x="140" y="59">      @@@@@@@      </text>
        <text x="140" y="77">   @@@       @@@   </text>
        <text x="140" y="95">  @@           @@  </text>
        <text x="140" y="113"> @@             @@ </text>
        <text x="140" y="131"> @@             @@ </text>
        <text x="140" y="149"> @@             @@ </text>
        <text x="140" y="167"> @@             @@ </text>
        <text x="140" y="185">  @@           @@  </text>
        <text x="140" y="203">   @@@       @@@   </text>
        <text x="140" y="221">      @@@@@@@      </text>
      </g>

      <g class="ascii plane-2">
        <text x="140" y="59">      =======      </text>
        <text x="140" y="77">   ===       ===   </text>
        <text x="140" y="95">  ==           ==  </text>
        <text x="140" y="113"> ==             == </text>
        <text x="140" y="131"> ==             == </text>
        <text x="140" y="149"> ==             == </text>
        <text x="140" y="167"> ==             == </text>
        <text x="140" y="185">  ==           ==  </text>
        <text x="140" y="203">   ===       ===   </text>
        <text x="140" y="221">      =======      </text>
      </g>

      <g class="ascii plane-3">
        <text x="140" y="59">      0101010      </text>
        <text x="140" y="77">   101       010   </text>
        <text x="140" y="95">  01           10  </text>
        <text x="140" y="113"> 10             01 </text>
        <text x="140" y="131"> 01             10 </text>
        <text x="140" y="149"> 10             01 </text>
        <text x="140" y="167"> 01             10 </text>
        <text x="140" y="185">  10           01  </text>
        <text x="140" y="203">   010       101   </text>
        <text x="140" y="221">      1010101      </text>
      </g>

      <g class="ascii plane-4">
        <text x="140" y="59">      -------      </text>
        <text x="140" y="77">   ---       ---   </text>
        <text x="140" y="95">  --           --  </text>
        <text x="140" y="113"> --             -- </text>
        <text x="140" y="131"> --             -- </text>
        <text x="140" y="149"> --             -- </text>
        <text x="140" y="167"> --             -- </text>
        <text x="140" y="185">  --           --  </text>
        <text x="140" y="203">   ---       ---   </text>
        <text x="140" y="221">      -------      </text>
      </g>
    </g>
  </g>
</svg>
